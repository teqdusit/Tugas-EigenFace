name: deploy-book

on:
  push:
    branches:
      - main

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build and Deploy Jupyter Book
        uses: jupyter-book/jupyter-book-github-pages-action@0.3.0
        with:
          target_branch: gh-pages